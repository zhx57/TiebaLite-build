syntax = "proto3";

package tieba.chat;

import "Error.proto";

option java_package = "com.huanchengfly.tieba.post.api.models.protos.chat";

message CommitPersonalMsgResIdl {
  tieba.Error error = 1;

  message DataRes {
    message BlockInfo {
      int32 blockErrno = 1;
      string blockErrmsg = 2;
    }

    int64 msgId = 1;
    int64 groupId = 2;
    int64 recordId = 3;
    int64 toUid = 4;
    int32 toUserType = 5;
    BlockInfo blockInfo = 6;
  }

  DataRes data = 2;
}
