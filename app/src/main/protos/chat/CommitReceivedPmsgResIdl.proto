syntax = "proto3";

package tieba.chat;

import "Error.proto";

option java_package = "com.huanchengfly.tieba.post.api.models.protos.chat";

message CommitReceivedPmsgResIdl {
  tieba.Error error = 1;

  message DataRes {
    int64 readMsgId = 1;
    int64 groupId = 2;
    int64 toUid = 3;
    int32 toUserType = 4;
  }

  DataRes data = 2;
}
