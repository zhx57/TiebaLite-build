syntax = "proto3";

package tieba.chat;

import "Error.proto";

option java_package = "com.huanchengfly.tieba.post.api.models.protos.chat";

message GetGroupMsgResIdl {
  tieba.Error error = 1;

  message DataRes {
    message GroupMsg {
      message GroupInfo {
        int64 groupId = 1;
        int32 groupType = 20;
      }

      message MsgInfo {
        message UserInfo {
          int64 userId = 1;
          string userName = 2;
          string portrait = 4;
        }

        int64 msgId = 1;
        int32 msgType = 3;
        string content = 5;
        int32 createTime = 8;
        UserInfo userInfo = 10;
      }

      GroupInfo groupInfo = 1;
      repeated MsgInfo msgList = 2;
    }

    repeated GroupMsg groupInfo = 1;
  }

  DataRes data = 2;
}
