syntax = "proto3";

package tieba.chat;

option java_package = "com.huanchengfly.tieba.post.api.models.protos.chat";

message GetGroupMsgReqIdl {
  string cuid = 1;

  message DataReq {
    message GroupLastId {
      int64 groupId = 1;
      int64 lastMsgId = 2;
    }

    repeated GroupLastId groupMids = 6;
    string gettype = 7;
  }

  DataReq data = 2;
}
