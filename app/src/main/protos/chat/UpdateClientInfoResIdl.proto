syntax = "proto3";

package tieba.chat;

import "Error.proto";

option java_package = "com.huanchengfly.tieba.post.api.models.protos.chat";

message UpdateClientInfoResIdl {
  tieba.Error error = 1;

  message DataRes {
    message GroupInfo {
      int64 groupId = 1;
      int32 groupType = 20;
      int64 lastMsgId = 21;
    }

    message UserInfo {
      int64 userId = 1;
      string userName = 2;
      string portrait = 4;
    }

    repeated GroupInfo groupInfo = 1;
    UserInfo userInfo = 2;
    int64 isUserAvailable = 6;
  }

  DataRes data = 2;
}
