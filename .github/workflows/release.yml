name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - miuix

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "zulu"

      # 有完整签名密钥时使用固定签名，否则回退 debug 签名（APK 仍可安装）
      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > tiebalite-release.p12

      - name: Generate keystore.properties
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "keystore.file=tiebalite-release.p12" >> keystore.properties
          echo "keystore.password=$STORE_PASSWORD" >> keystore.properties
          echo "keystore.key.alias=$KEY_ALIAS" >> keystore.properties
          echo "keystore.key.password=$KEY_PASSWORD" >> keystore.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # 允许写回缓存，后续构建可复用依赖与 wrapper
          cache-read-only: false
          cache-cleanup: on-success

      - name: Cache Android build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/build-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/build/intermediates
            build
          key: ${{ runner.os }}-android-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-android-

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --build-cache --parallel

      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK"
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$APK" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ./app/build/outputs/apk/release

      - name: Compute release tag
        id: tag
        run: echo "name=build-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          files: ./app/build/outputs/apk/release/*.apk
          body: |
            由 GitHub Actions 自动构建并发布。

            提交: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
